<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>休憩BGMの再生検証</title><style>body{background:#171723;color:#eee;font:16px system-ui}iframe{width:100%;height:700px;border:0}button{padding:12px}li{margin:8px}</style><h1>休憩BGMの再生検証</h1><p>この画面は専用のテスト用ブラウザで使用してください。タイマー設定は終了時に復元します。</p><button id="run">再生と切り替えを検証</button><p id="result">未実行</p><ul id="log"></ul><iframe id="app" src="../?break-preview"></iframe><script>
const frame=document.querySelector('#app'),button=document.querySelector('#run'),result=document.querySelector('#result'),log=document.querySelector('#log');
const waitFor=condition=>new Promise((resolve,reject)=>{const end=Date.now()+20000;const timer=setInterval(()=>{if(condition()){clearInterval(timer);resolve()}else if(Date.now()>end){clearInterval(timer);reject(Error('再生待機がタイムアウトしました'))}},50)});
const report=text=>{const item=document.createElement('li');item.textContent=text;log.append(item)};
button.onclick=async()=>{button.disabled=true;log.replaceChildren();result.textContent='検証中';const w=frame.contentWindow,doc=w.document,audio=doc.querySelector('#bgm');const key='pomodoro_workspace_v1',original=w.localStorage.getItem(key);try{
 w.eval('state.timer.running=false;state.settings.alarm=false;setMode("focus");showPanel("music")');
 doc.querySelector('[data-track]').click();await waitFor(()=>!audio.paused&&audio.readyState>=3);audio.currentTime=12;await waitFor(()=>audio.currentTime>=12);
 w.eval('state.timer.remaining=1;startTimer();save()');
 await waitFor(()=>doc.body.dataset.mode==='short'&&!audio.paused&&audio.readyState>=3&&audio.getAttribute('src').startsWith('audio/break/'));report('集中終了で休憩用音楽へ自動切り替え');
 const heard=new Set();for(let i=0;i<3;i++){const src=audio.getAttribute('src');heard.add(src);report('再生成功：'+src);audio.currentTime=audio.duration-.15;await waitFor(()=>audio.getAttribute('src')!==src&&!audio.paused&&audio.readyState>=3)}if(heard.size!==3)throw Error('3曲一巡前に重複');report('休憩曲3曲のシャッフルと周回成功');
 w.eval('state.timer.remaining=1;startTimer();save()');await waitFor(()=>doc.body.dataset.mode==='focus'&&!audio.paused&&audio.readyState>=3&&audio.currentTime>=12);report('休憩終了で集中曲の続きに復帰');
 w.eval('pauseMusic();setMode("short")');if(!audio.paused)throw Error('停止中に再開した');report('手動停止中は再生しない');
 result.textContent='成功：自動切り替え・3曲再生・周回・途中再開・停止維持';result.dataset.result='passed';
 }catch(error){result.textContent='失敗：'+error.message;result.dataset.result='failed'}finally{w.eval('pauseMusic()');if(original)w.localStorage.setItem(key,original);else w.localStorage.removeItem(key);w.eval('state=read();render()');button.disabled=false}};
</script></html>
