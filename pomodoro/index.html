<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101219">
<title>ポモドーロタイマー｜集中して短時間で成果を出す</title><meta name="description" content="音楽と美しい背景で集中するポモドーロタイマー。タスク管理、集中記録、毎日のチャレンジを無料で。">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script src="ui-text.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5h2v14H8zM16 5h2v14h-2z"/></symbol><symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol><symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="17" cy="16" rx="3" ry="3"/></symbol><symbol id="i-tasks" viewBox="0 0 24 24"><path d="m3 6 2 2 4-4m3 2h9M3 13l2 2 4-4m3 2h9M3 20l2 2 4-4m3 2h9"/></symbol><symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c4 0 1-4 4-5h2c6-2 2-13-6-13Z"/><circle cx="7" cy="10" r=".8"/><circle cx="11" cy="7" r=".8"/><circle cx="16" cy="8" r=".8"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 3h3l2 3 3-1 1-3 3-1 2-3-2-2 1-3-3-3h-3l-2-3Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-cup" viewBox="0 0 24 24"><path d="M7 3h10v7a5 5 0 0 1-10 0ZM7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4m-5 3v6m-4 0h8"/></symbol><symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M13 12h6v6h-6Z"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C7 1 1 11 7 17s16 0 13-14ZM4 21 15 10"/></symbol></svg>
<div class="scenery" aria-hidden="true"><video id="background-video" muted loop playsinline preload="none" poster="assets/lofi.webp" hidden></video></div><div class="veil" aria-hidden="true"></div><div id="ambience" aria-hidden="true"></div>
<header><a class="brand" href="./">Pomodoro Timer</a></header>
<aside class="rail" aria-label="ツール"><button class="icon-button" data-panel="challenge" aria-label="今日のチャレンジ"><svg><use href="#i-cup"/></svg></button><button class="icon-button streak-button" data-panel="stats" aria-label="あなたのストリーク"><span>🔥</span><small id="streak">0</small></button><hr><button class="icon-button" data-panel="appearance" aria-label="美観"><svg><use href="#i-palette"/></svg></button><button class="icon-button" data-panel="settings" aria-label="設定"><svg><use href="#i-settings"/></svg></button></aside>
<main id="top">
<div class="modes" role="tablist" aria-label="タイマーのモード"><button role="tab" aria-selected="true" data-mode="focus">集中 <span id="count-focus">0</span></button><button role="tab" aria-selected="false" data-mode="short">小休憩 <span id="count-short">0</span></button><button role="tab" aria-selected="false" data-mode="long">長い休憩 <span id="count-long">0</span></button></div>
<div class="timer-wrap"><svg class="timer-ring" viewBox="0 0 360 360" aria-hidden="true"><defs><linearGradient id="ring-gradient" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#eeebff"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><circle class="ring-track" cx="180" cy="180" r="166"/><circle id="progress" cx="180" cy="180" r="166"/></svg><div class="timer-face"><div id="clock" role="timer" aria-label="残り25分">25:00</div><div class="session-label"><i></i><span id="mode-label">集中セッション</span></div><div id="active-task"></div></div></div>
<button class="quote" id="quote" aria-label="フレーズを編集">「朝の小さな前向きな考えひとつで、一日がまるごと変わることもあります。」</button>
</main>
<nav class="dock" aria-label="タイマー操作"><button data-panel="music" class="dock-secondary"><svg><use href="#i-music"/></svg><span>音楽</span><i id="music-dot"></i></button><button id="reset" class="icon-button" aria-label="停止"><svg><use href="#i-stop"/></svg></button><button id="toggle" class="start-button"><svg><use href="#i-play"/></svg><span>開始</span></button><button id="mini" class="icon-button" aria-label="タイマーを別ウィンドウで開く"><svg><use href="#i-window"/></svg></button><button data-panel="tasks" class="dock-secondary" aria-label="タスクを表示"><svg><use href="#i-tasks"/></svg><span>タスク</span></button></nav>
<div id="backdrop" hidden></div><aside id="panel" class="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-heading"><div><p id="panel-eyebrow" hidden></p><h2 id="panel-title"></h2></div><button class="icon-button" id="close-panel" aria-label="パネルを閉じる"><svg><use href="#i-close"/></svg></button></div><div id="panel-body"></div></aside>
<dialog id="quote-dialog"><form method="dialog"><h2>フレーズを編集</h2><label for="quote-input">自分だけのモチベーションフレーズを書く</label><textarea id="quote-input" maxlength="120" rows="3"></textarea><div><button type="button" id="reset-quote">デフォルトに戻す</button><button value="cancel">キャンセル</button><button value="save" class="primary">保存</button></div></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div><button value="cancel">キャンセル</button><button value="confirm" id="confirm-action" class="primary"></button></div></form></dialog>
<dialog id="task-dialog"><form method="dialog"><h2>タスクを編集</h2><label for="task-edit-title">タスク名</label><input id="task-edit-title" maxlength="160" required style="width:100%"><label for="task-edit-notes">説明</label><textarea id="task-edit-notes" placeholder="メモ、背景、リンクを追加…"></textarea><label for="task-edit-status">ステータス</label><select id="task-edit-status"></select><label for="task-edit-priority">優先度</label><select id="task-edit-priority"></select><label for="task-edit-due">期限</label><input id="task-edit-due" type="date"><label for="task-edit-labels">タグ</label><input id="task-edit-labels" placeholder="タグを追加…"><div><button value="cancel" formnovalidate>キャンセル</button><button value="save" class="primary">保存</button></div></form></dialog>
<div id="toast" role="status"></div><audio id="bgm" preload="auto"></audio>
</body></html>
