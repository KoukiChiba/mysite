<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeInvest | 投資シミュレーター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Hero Gradient Card -->
        <div class="hero-card">
            <div class="hero-top">
                <div class="hero-meta">
                    <span class="hero-label">純資産</span>
                    <button id="vibe-toggle" class="btn-icon-ghost">
                        <i data-lucide="eye" size="15"></i>
                    </button>
                </div>
                <div class="hero-balance-row">
                    <span class="hero-currency">¥</span><span id="total-balance" class="hero-balance">1,000,000</span>
                </div>
                <div class="hero-profit-row">
                    <span id="total-profit-badge" class="hero-profit-badge">+0.00%</span>
                    <span class="hero-profit-label">日次損益</span>
                </div>
            </div>

            <!-- Asset Breakdown -->
            <div class="asset-breakdown">
                <div class="asset-mini-card">
                    <div class="asset-icon-wrap sp500">S</div>
                    <div class="mini-info">
                        <span class="mini-label">S&amp;P 500</span>
                        <span id="bal-stock" class="mini-value">¥0</span>
                    </div>
                    <span id="pct-stock" class="mini-pct"></span>
                </div>
                <div class="asset-mini-card">
                    <div class="asset-icon-wrap fx">$</div>
                    <div class="mini-info">
                        <span class="mini-label">FX (米ドル)</span>
                        <span id="bal-fx" class="mini-value">¥0</span>
                    </div>
                    <span id="pct-fx" class="mini-pct"></span>
                </div>
                <div class="asset-mini-card">
                    <div class="asset-icon-wrap btc">₿</div>
                    <div class="mini-info">
                        <span class="mini-label">暗号資産</span>
                        <span id="bal-crypto" class="mini-value">¥0</span>
                    </div>
                    <span id="pct-crypto" class="mini-pct"></span>
                </div>
                <div class="asset-mini-card">
                    <div class="asset-icon-wrap jpy">¥</div>
                    <div class="mini-info">
                        <span class="mini-label">現金 (日本円)</span>
                        <span id="bal-cash" class="mini-value">¥1,000,000</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Trade Area -->
        <main class="trading-area">
            <!-- Asset Tabs -->
            <nav class="mode-selector">
                <button class="mode-tab active" data-mode="stock">株式投資</button>
                <button class="mode-tab" data-mode="fx">FX</button>
                <button class="mode-tab" data-mode="crypto">暗号資産</button>
            </nav>

            <!-- View Mode -->
            <div class="view-tabs">
                <button class="view-tab active" data-view="single">チャート</button>
                <button class="view-tab" data-view="multi">全表示</button>
                <button class="view-tab" data-view="history">資産推移</button>
            </div>

            <!-- Single View -->
            <div id="single-view">
                <section class="content-card chart-section">
                    <div class="card-header">
                        <div>
                            <h3 id="asset-label">S&amp;P 500 (米国株)</h3>
                            <span id="current-price" class="price-large">¥5,100</span>
                        </div>
                        <span id="price-change" class="change-tag positive">+0.2%</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="marketChart"></canvas>
                    </div>
                    <div class="time-tabs">
                        <button class="time-tab active">1H</button>
                        <button class="time-tab">1D</button>
                        <button class="time-tab">1W</button>
                        <button class="time-tab">1M</button>
                        <button class="time-tab">1Y</button>
                    </div>
                </section>

                <section class="order-section">
                    <div class="input-container">
                        <span class="input-prefix">¥</span>
                        <input type="number" id="trade-amount" placeholder="金額を入力">
                    </div>
                    <div class="action-buttons">
                        <button id="sell-btn" class="btn btn-sell">売る</button>
                        <button id="buy-btn" class="btn btn-buy">買う</button>
                    </div>
                </section>
            </div>

            <!-- Multi View -->
            <div id="multi-view" class="hidden">
                <div class="multi-grid">
                    <div class="asset-card-small" data-mode="stock">
                        <div class="card-small-header">
                            <div class="small-asset-identity">
                                <div class="asset-icon-sm sp500">S</div>
                                <span>S&amp;P 500</span>
                            </div>
                            <span id="price-stock-sm" class="sm-price">¥0</span>
                        </div>
                        <div class="sm-chart-container">
                            <canvas id="chart-stock-sm"></canvas>
                        </div>
                    </div>
                    <div class="asset-card-small" data-mode="fx">
                        <div class="card-small-header">
                            <div class="small-asset-identity">
                                <div class="asset-icon-sm fx">$</div>
                                <span>FX / USD</span>
                            </div>
                            <span id="price-fx-sm" class="sm-price">¥0</span>
                        </div>
                        <div class="sm-chart-container">
                            <canvas id="chart-fx-sm"></canvas>
                        </div>
                    </div>
                    <div class="asset-card-small" data-mode="crypto">
                        <div class="card-small-header">
                            <div class="small-asset-identity">
                                <div class="asset-icon-sm btc">₿</div>
                                <span>ビットコイン</span>
                            </div>
                            <span id="price-crypto-sm" class="sm-price">¥0</span>
                        </div>
                        <div class="sm-chart-container">
                            <canvas id="chart-crypto-sm"></canvas>
                        </div>
                    </div>
                </div>
                <section class="order-section">
                    <div class="asset-info">
                        <span id="asset-label-multi" class="mode-label">銘柄を選択</span>
                        <span id="current-price-multi" class="price-value">¥ -</span>
                    </div>
                    <div class="input-container">
                        <span class="input-prefix">¥</span>
                        <input type="number" id="trade-amount-multi" placeholder="投資金額を入力">
                    </div>
                    <div class="action-buttons">
                        <button id="sell-btn-multi" class="btn btn-sell">売る</button>
                        <button id="buy-btn-multi" class="btn btn-buy">買う</button>
                    </div>
                </section>
            </div>

            <!-- History View -->
            <div id="history-view" class="hidden">
                <!-- 指標グリッド -->
                <div class="history-metrics">
                    <div class="metric-card metric-main">
                        <span class="metric-label">総資産</span>
                        <span id="history-total-label" class="metric-value-lg">¥1,000,000</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">評価損益</span>
                        <span id="history-pnl-label" class="metric-value">+¥0</span>
                        <span id="history-pnl-pct" class="metric-sub">+0.00%</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">最高値</span>
                        <span id="history-peak-label" class="metric-value metric-up">¥1,000,000</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">最安値</span>
                        <span id="history-trough-label" class="metric-value metric-down">¥1,000,000</span>
                    </div>
                </div>

                <!-- チャートパネル -->
                <div class="history-panel">
                    <div class="h-time-tabs">
                        <button class="h-time-tab active" data-range="1h">1H</button>
                        <button class="h-time-tab" data-range="1d">1D</button>
                        <button class="h-time-tab" data-range="1w">1W</button>
                        <button class="h-time-tab" data-range="1m">1M</button>
                        <button class="h-time-tab" data-range="all">全期間</button>
                    </div>
                    <div class="history-legend">
                        <div class="legend-item"><span class="legend-dot total-dot"></span>総資産</div>
                        <div class="legend-item"><span class="legend-dot stock-dot"></span>株式</div>
                        <div class="legend-item"><span class="legend-dot fx-dot"></span>FX</div>
                        <div class="legend-item"><span class="legend-dot crypto-dot"></span>暗号資産</div>
                    </div>
                    <div class="chart-container-large">
                        <canvas id="totalHistoryChart"></canvas>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active">
                <i data-lucide="home" size="20"></i>
                <span>ホーム</span>
            </button>
            <button class="nav-btn">
                <i data-lucide="bar-chart-2" size="20"></i>
                <span>マーケット</span>
            </button>
            <button class="nav-btn">
                <i data-lucide="wallet" size="20"></i>
                <span>資産</span>
            </button>
            <button class="nav-btn">
                <i data-lucide="user" size="20"></i>
                <span>マイページ</span>
            </button>
        </nav>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden">
        <i data-lucide="bell" size="15"></i>
        <span id="toast-message">市場が開きました</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
