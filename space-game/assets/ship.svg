  <path d="M91 39 118 9h39l-28 40Z" fill="#e9faff" stroke="#08182f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M141 35c17 1 34 7 47 17l-13 14h-54l7-28c4-2 8-3 13-3Z" fill="url(#glass)" stroke="#08182f" stroke-width="5" stroke-linejoin="round"/>
