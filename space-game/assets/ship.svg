  <path d="M103 49h12M128 78h18M157 77h11" stroke="#0a2d4f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="98" cy="68" r="9" fill="#15305a" stroke="#76f5ff" stroke-width="4"/>
