<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game | Interactive Mini Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-overlay" class="overlay">
            <div id="start-screen" class="glass-panel">
                <h1 class="pixel-text">SPACE GAME</h1>
                <p class="description">星雲を抜けて、光る音符をすべて回収しよう。</p>
                <div class="controls">
                    <span>TAP / CLICK / SPACE : 上昇</span>
                </div>
                <button id="start-button" class="btn-primary">START JOURNEY</button>
            </div>

            <div id="game-info" class="hidden">
                <div class="score-box">
                    <span class="label">COINS</span>
                    <span id="score" class="value">0 / 6</span>
                </div>
                <div class="time-box">
                    <span id="timer" class="value">00:00</span>
                </div>
            </div>

            <div id="game-over-screen" class="glass-panel hidden">
                <h2 class="pixel-text">MISSION OVER</h2>
                <p id="final-stats"></p>
                <button id="restart-button" class="btn-primary">RETRY</button>
            </div>
        </div>
        
        <!-- Music Toggle (Global) -->
        <button id="music-toggle" class="music-btn"><span>🔊</span></button>
    </div>
    <script src="game.js"></script>
</body>
</html>
