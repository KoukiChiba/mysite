// --- 地図初期化 ---
let map, markersLayer = [];
let mapInitialized = false;

function initMap(spots) {
  if (!mapInitialized) {
    map = L.map('map').setView([37.5326, 127.0246], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);
    mapInitialized = true;
  }
  markersLayer.forEach(m => map.removeLayer(m));
  markersLayer = [];

  spots.forEach(spot => {
    const color = spot.washlet ? '#d94f43' : '#888';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:28px;height:28px;background:${color};border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,0.25)"></div>`,
      iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -30]
    });
    const m = L.marker([spot.lat, spot.lng], { icon })
      .addTo(map)
      .bindPopup(`<b>${spot.name}</b><br><small>${spot.area} · ${spot.category}</small><br><small>${spot.notes}</small>`);
    markersLayer.push(m);
  });
}

function toggleMap() {
  const container = document.getElementById('map-container');
  const btn = document.getElementById('mapToggleBtn');
  const isOpen = container.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  btn.textContent = isOpen ? '🗺️ 地図を閉じる' : '🗺️ 地図で全体を見る';

  if (isOpen) {
    initMap(currentFiltered);
    setTimeout(() => map.invalidateSize(), 50);
  }
}

  document.getElementById('count').textContent = spots.length;

  if (mapInitialized && document.getElementById('map-container').classList.contains('open')) {
    initMap(spots);
  }

  const list = document.getElementById('list');
  list.innerHTML = '';

  spots.forEach(spot => {
    const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name + ' ' + spot.name_ko + ' ソウル')}`;
    const naverUrl = `https://map.naver.com/v5/search/${encodeURIComponent(spot.name_ko)}`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${spot.name}</div>
            <div class="card-name-ko">${spot.name_ko}</div>
          </div>
          <span class="area-badge">${spot.area}</span>
        </div>
        <div class="card-meta">
          <span class="badge badge-cat">${spot.category}</span>
          <span class="badge ${spot.washlet ? 'badge-washlet' : 'badge-no'}">
            ${spot.washlet ? '🚿 ウォシュレットあり' : 'ウォシュレット不明'}
          </span>
        </div>
        <div class="card-notes">${spot.notes}</div>
        <div class="card-hours">🕐 ${spot.hours}</div>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="window.open('${googleMapsUrl}','_blank')">
          📍 Google Maps
        </button>
        <button class="action-btn" onclick="window.open('${naverUrl}','_blank')">
          🗺️ Naver Map
        </button>
      </div>
    `;
    list.appendChild(card);
  });
}

// --- フィルター ---
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const area = btn.dataset.area;
    const filtered = area === 'all' ? SPOTS : SPOTS.filter(s => s.area === area);
    renderList(filtered);
  });
});

renderList(SPOTS);
</script>
</body>
</html>
